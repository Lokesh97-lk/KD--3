version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codeintellect-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codeintellect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codeintellect-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=backend:.
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/codeintellect
      - CORS_ORIGINS=*
      - SECRET_KEY=production-secret-key-change-in-production
      - CODE_RUNNER_URL=http://code_runner:8001
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python scripts/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  code_runner:
    build:
      context: .
      dockerfile: code_runner/Dockerfile
    container_name: codeintellect-runner
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=.
    command: uvicorn code_runner.server:app --host 0.0.0.0 --port 8001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeintellect-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
